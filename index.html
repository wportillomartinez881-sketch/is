<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - NEXUS S.A. de C.V.</title>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #030712;
            color: #cbd5e1;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* --- EFECTOS VISUALES DE FONDO (Lluvia Azul y Partículas Moradas, Sin Amarillo) --- */
        .bg-effects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
            background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #030712 70%);
        }

        .rain-line {
            position: absolute;
            background: linear-gradient(to bottom, rgba(56, 189, 248, 0), rgba(56, 189, 248, 0.95), rgba(56, 189, 248, 0));
            width: 2.5px;
            height: 90px;
            opacity: 0.85;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-100px); opacity: 0; }
            50% { opacity: 0.95; }
            100% { transform: translateY(105vh); opacity: 0; }
        }

        .purple-particle {
            position: absolute;
            background: #a855f7;
            border-radius: 50%;
            box-shadow: 0 0 6px #a855f7, 0 0 10px #7e22ce;
            animation: floatParticle ease-in-out infinite;
        }

        @keyframes floatParticle {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.4; }
            50% { transform: translateY(-30px) scale(1.2); opacity: 0.8; }
        }

        /* --- CONTENEDOR DE LOGIN (Bordes sobrios morados/azules, sin brillo excesivo) --- */
        .login-card {
            background: rgba(13, 17, 30, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(168, 85, 247, 0.25);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            position: relative;
            z-index: 1;
            transition: all 0.3s ease;
        }

        .login-card:hover {
            border-color: rgba(168, 85, 247, 0.5);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.2);
        }

        .login-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .login-header h2 {
            color: #ffffff;
            font-size: 1.8rem;
            margin-bottom: 8px;
            background: linear-gradient(to right, #ffffff, #c084fc, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-header p {
            font-size: 0.85rem;
            color: #94a3b8;
            margin: 0;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: #cbd5e1;
        }

        .form-control {
            width: 100%;
            padding: 11px 14px;
            background: rgba(10, 14, 24, 0.9);
            border: 1px solid rgba(168, 85, 247, 0.25);
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.95rem;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.35);
        }

        .btn-login {
            background: linear-gradient(135deg, #3b0764, #7e22ce);
            color: #ffffff;
            border: 1px solid rgba(192, 132, 252, 0.4);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            width: 100%;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(126, 34, 206, 0.3);
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #7e22ce, #a855f7);
            border-color: #c084fc;
            box-shadow: 0 0 15px rgba(192, 132, 252, 0.4), 0 0 8px rgba(56, 189, 248, 0.4);
            transform: translateY(-1px);
        }

        /* --- BOTÓN / ENLACE DE CONTACTO RESTAURADO --- */
        .login-footer-actions {
            margin-top: 20px;
            text-align: center;
            border-top: 1px solid rgba(168, 85, 247, 0.15);
            padding-top: 15px;
        }

        .btn-contact-link {
            background: transparent;
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }

        .btn-contact-link:hover {
            background: rgba(56, 189, 248, 0.1);
            border-color: #38bdf8;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.25);
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Fondo dinámico (Lluvia azul y partículas moradas) -->
    <div class="bg-effects" id="bgEffects"></div>

    <div class="login-card">
        <div class="login-header">
            <h2>NEXUS</h2>
            <p>Sistema Corporativo de Gestión</p>
        </div>

        <form id="loginForm" onsubmit="manejarLogin(event)">
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Correo Electrónico</label>
                <input type="email" id="loginCorreo" class="form-control" placeholder="admin@nexus.com.sv" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Contraseña</label>
                <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-login">
                <i class="fas fa-sign-in-alt"></i> Ingresar al Sistema
            </button>
        </form>

        <!-- Botón de contacto restaurado en el login -->
        <div class="login-footer-actions">
            <a href="contacto.html" class="btn-contact-link">
                <i class="fas fa-headset"></i> ¿Necesitas Soporte o Contacto?
            </a>
        </div>
    </div>

    <script>
        // Generador de efectos de lluvia azul y partículas moradas
        document.addEventListener("DOMContentLoaded", () => {
            const bgEffects = document.getElementById('bgEffects');
            
            for (let i = 0; i < 35; i++) {
                const line = document.createElement('div');
                line.className = 'rain-line';
                line.style.left = `${Math.random() * 100}%`;
                line.style.top = `${Math.random() * -100}px`;
                line.style.height = `${Math.random() * 70 + 40}px`;
                line.style.animationDuration = `${Math.random() * 1.8 + 1.2}s`;
                line.style.animationDelay = `${Math.random() * 5}s`;
                bgEffects.appendChild(line);
            }

            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'purple-particle';
                const size = Math.random() * 3 + 2;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.top = `${Math.random() * 100}%`;
                particle.style.animationDuration = `${Math.random() * 3 + 2}s`;
                particle.style.animationDelay = `${Math.random() * 3}s`;
                bgEffects.appendChild(particle);
            }
        });

        function manejarLogin(event) {
            event.preventDefault();
            const correo = document.getElementById('loginCorreo').value;
            
            // Simulación de acceso guardando sesión local
            const usuarioObj = { nombre: "Administrador Nexus", correo: correo, rol: "Administrador" };
            localStorage.setItem('nexus_usuario', JSON.stringify(usuarioObj));
            
            // Redirige al dashboard principal
            window.location.href = "dashboard.html";
        }
    </script>
</body>
</html>
